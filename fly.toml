app = "mtrx-bus-tracker-api"
primary_region = "sin" # Singapore or nearest datacenter for minimal routing latency

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "5000"
  NODE_ENV = "production"
