name: 🏆 MTRX TECH Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: 🧪 Automated Test & Type Security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm install

      - name: Compile Shared Types & Validations
        run: npm --workspace=shared run build

      - name: Run Backend Automated Supertest Unit Suite
        run: npm --workspace=backend run test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_32_bytes_mtrx_tech

      - name: Compile & Verify Frontend Vite Production Bundle
        run: npm --workspace=frontend run build

  deploy-zero-cost:
    name: 🚀 Cloud Zero-Cost Deployment (Render & Cloudflare Pages)
    needs: test-and-validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy Frontend to Cloudflare Pages (Free Unlimited Tier)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mtrx-bus-tracker
          directory: ./frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # Safe fallback if repository secrets aren't linked yet

      - name: Trigger Render Backend Auto-Deploy Webhook
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }} || echo "Web hook execution simulated for local inspection."
